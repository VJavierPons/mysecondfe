
trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- bash: |
    npm ci
    npm -v
    node -v
    npx ng version
    ls -la node_modules/.bin | head -n 20
  displayName: 'Install dependencies + quick debug'

- bash: |
    npm run test -- --watch=false --coverage
  displayName: 'Run Tests'

- bash: |
    npm run build -- --configuration production
  displayName: 'Build Angular'
