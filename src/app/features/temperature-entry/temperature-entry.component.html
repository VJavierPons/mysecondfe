<h1>mysecondfe</h1>
<div class="main-container">
  
  <!-- Left Side: Data Table -->
  <div class="table-panel">
    <h3>Temperature Entries</h3>
    
    <div class="spinner-overlay" *ngIf="isLoading">
      <mat-spinner diameter="50"></mat-spinner>
    </div>

    <div class="table-container" [class.hidden]="isLoading">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- Temperature Column -->
        <ng-container matColumnDef="temperatureC">
          <th mat-header-cell *matHeaderCellDef> Temperature (°C) </th>
          <td mat-cell *matCellDef="let element"> {{element.temperatureC}} </td>
        </ng-container>

        <!-- Summary Column -->
        <ng-container matColumnDef="summary">
          <th mat-header-cell *matHeaderCellDef> Summary </th>
          <td mat-cell *matCellDef="let element"> {{element.summary}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator #paginator
                     [pageSize]="5"
                     [pageSizeOptions]="[5, 10, 20]"
                     showFirstLastButtons
                     aria-label="Select page of periodic elements">
      </mat-paginator>
    </div>
  </div>

  <!-- Right Side: Interaction Panel -->
  <div class="entry-card">
    <h2>Weather Entry</h2>
    
    <div class="input-group">
      <label for="temp">Temperature (°C)</label>
      <input type="number" id="temp" [(ngModel)]="temperatureC" placeholder="Enter temperature">
    </div>

    <div class="input-group">
      <label for="summary">Summary</label>
      <input type="text" id="summary" [(ngModel)]="summary" placeholder="Enter summary">
    </div>

    <div class="actions">
      <button class="delete-btn" (click)="toggleDeletePanel()">Delete</button>
      <button class="add-btn" (click)="onAdd()">{{currentId ? 'Update' : 'Add'}}</button>
      <button class="get-btn" (click)="onGet()">Get</button>
    </div>
  </div>

  <!-- Delete Modal Panel -->
  <div class="modal-overlay" *ngIf="showDeletePanel" (click)="toggleDeletePanel()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>Delete Entry</h3>
      <div class="input-group">
        <label for="deleteId">Entry ID to delete</label>
        <input type="text" id="deleteId" [(ngModel)]="deleteId" placeholder="Enter ID">
      </div>
      <button class="confirm-delete-btn" (click)="onDelete()">
        Are you sure? This action cannot be undone.
      </button>
      <button class="cancel-btn" (click)="toggleDeletePanel()">Cancel</button>
    </div>
  </div>
</div>
